# CI/CD: test the backend and frontend on every push and pull request.
# On a push to main (after all tests pass), the backend is deployed to Hugging Face Spaces.
# The frontend is deployed by Vercel itself (connected to this repo).

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  frontend:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://example.com

  deploy-backend:
    name: Deploy backend to Hugging Face
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install huggingface_hub
      - name: Upload the backend folder to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ashharr/ats-backend
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import upload_folder

          upload_folder(
              repo_id=os.environ["HF_SPACE"],
              repo_type="space",
              folder_path="backend",
              token=os.environ["HF_TOKEN"],
              commit_message=f"Deploy {os.environ['GITHUB_SHA'][:7]}",
              ignore_patterns=["venv/**", "tests/**", "**/__pycache__/**", ".pytest_cache/**", ".env", "*.db"],
              delete_patterns=["**"],  # remove old files that are no longer in backend/
          )
          EOF
